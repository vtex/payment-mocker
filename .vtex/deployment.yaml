name: payment-mocker
referenceId: HA5SIOPR
description: CI pipeline for payment-mocker
build:
  provider: dkcicd
  pipelines:
    - name: node-ci-v2
      parameters:
        nodeCommands:
          - install
        nodeVersion: 20-bookworm
      runtime:
        architecture: amd64
      when:
        - event: pull_request
          source: branch
        - event: push
          source: branch
          regex: master